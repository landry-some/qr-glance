[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-glance"
version = "0.1.0"
description = "Make QR codes in the terminal and read them back from image files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]
dependencies = [
    "segno>=1.6",
    "zxing-cpp>=2.2",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qrg = "qr_glance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
